name: Trigger Private Demo

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  PRIVATE_OWNER: "IAKalash"
  PRIVATE_REPO: "Advanced-Transit-Detection-System"

jobs:
  trigger:
    # Запускаем только если это комментарий в Issue (не PR) и он содержит команду
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/run-demo')
    runs-on: ubuntu-latest
    steps:
      - name: Подтверждение в комментариях
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 Команда принята! Запускаю демо... Ожидайте готовности артефактов в этом Workflow."
            })

      - name: Запустить приватный workflow
        run: |
          echo "Запускаем workflow в приватном репозитории..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/workflows/demo.yaml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Запрос отправлен"

      - name: Получить run ID запущенного workflow
        id: get-run
        run: |
          sleep 10
          RUNS=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            "https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/runs?per_page=1")
          
          RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id // empty')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Ждать завершения workflow
        id: wait
        run: |
          RUN_ID="${{ steps.get-run.outputs.run_id }}"
          for i in {1..40}; do
            sleep 15
            RUNS=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
              "https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/runs/$RUN_ID")
            STATUS=$(echo "$RUNS" | jq -r '.status // empty')
            if [ "$STATUS" = "completed" ]; then
              echo "✅ Завершено!"
              break
            fi
          done

      - name: Скачать артефакты
        run: |
          RUN_ID="${{ steps.get-run.outputs.run_id }}"
          ARTIFACTS=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            "https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/runs/$RUN_ID/artifacts")
          
          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url // empty')
          
          if [ -n "$DOWNLOAD_URL" ]; then
            curl -L -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" -o artifacts.zip "$DOWNLOAD_URL"
            mkdir -p ./results
            unzip -o artifacts.zip -d ./results
          fi

      - name: Загрузить артефакт в публичный репозиторий
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-results
          path: ./results

      - name: Финальный статус в комментарий
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}" == "success" ? "✅ Демо успешно завершено! Результаты можно скачать в разделе Actions." : "❌ Произошла ошибка при запуске демо.";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: status
            })