name: External Trigger Receiver

on:
  repository_dispatch:
    types: [run-demo]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_REPO_DEMO }}" \
            https://api.github.com/repos/Artyom743/demo_ui/actions/workflows/demo_publ.yaml/dispatches \
            -d '{"ref":"main"}'